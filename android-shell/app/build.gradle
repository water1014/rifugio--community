plugins { id 'com.android.application' }

// Apply only when a real Firebase Android app configuration is supplied.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'app.rifugio.shell'
    compileSdk 35
    defaultConfig {
        applicationId 'app.rifugio.shell'
        minSdk 23
        targetSdk 35
        versionCode (project.findProperty('nidoVersionCode') ?: '1').toString().toInteger()
        versionName '0.1.0'
    }
}

dependencies {
    // Firebase Messaging is optional at runtime until a project-specific google-services.json is added.
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'org.unifiedpush.android:connector:3.3.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
}
