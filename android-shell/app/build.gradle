plugins { id 'com.android.application' }

// Apply only when a real Firebase Android app configuration is supplied.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def nidoVersionCode = providers.gradleProperty('nidoVersionCode').getOrElse('1').toInteger()
def nidoKeystorePath = System.getenv('NIDO_KEYSTORE_PATH')

android {
    namespace 'app.rifugio.shell'
    compileSdk 35
    defaultConfig {
        applicationId 'app.rifugio.shell'
        minSdk 23
        targetSdk 35
        versionCode = nidoVersionCode
        versionName '0.1.0'
    }

    // Prefer a durable, privately stored signing key when CI secrets are configured.
    // Until then, retain Android's normal debug signing for preview builds.
    if (nidoKeystorePath) {
        signingConfigs {
            nido {
                storeFile file(nidoKeystorePath)
                storePassword System.getenv('NIDO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NIDO_KEY_ALIAS')
                keyPassword System.getenv('NIDO_KEY_PASSWORD')
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.nido
            }
        }
    }
}

dependencies {
    // Firebase Messaging is optional at runtime until a project-specific google-services.json is added.
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
    implementation 'org.unifiedpush.android:connector:3.3.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
}
