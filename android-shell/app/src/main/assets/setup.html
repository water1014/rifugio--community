<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f7f2">
<title>Nido</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f9f7f2,#e8eef0);color:#26343b;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(100%,420px);padding:30px;border:1px solid #ffffffb8;border-radius:26px;background:#ffffffa8;box-shadow:0 18px 60px #26343b18}
.mark{font-family:Georgia,serif;font-size:34px;letter-spacing:.04em;margin:0 0 8px}.sub{color:#718087;line-height:1.7;margin:0 0 28px}
label{display:block;font-size:13px;color:#52636a;margin:0 0 9px}input{width:100%;border:1px solid #cbd5d6;border-radius:13px;padding:15px;background:#fff;color:#26343b;font-size:15px;outline:none}
button{width:100%;margin-top:15px;padding:15px;border:0;border-radius:13px;background:#314c55;color:#fff;font-size:15px;font-weight:600}
.note{font-size:12px;color:#89979a;line-height:1.6;margin-top:18px}
</style>
</head>
<body><main>
<p class="mark">Nido</p>
<p class="sub">一个只属于你的私人空间。连接你的 Nido HTTPS 服务后即可进入。</p>
<label for="server">服务器地址</label>
<input id="server" type="url" inputmode="url" placeholder="https://your-domain.example">
<button onclick="connect()">连接 Nido</button>
<p class="note">服务器地址只保存在本机应用私有空间。请使用 HTTPS 地址。此 APK 外壳不会内置你的 API 密钥。</p>
</main>
<script>
const field=document.getElementById('server');
try{field.value=window.RifugioNative?.current?.()||''}catch(_){}
function connect(){const value=field.value.trim();if(!/^https:\/\//i.test(value)){alert('请输入以 https:// 开头的服务器地址');return}window.RifugioNative.connect(value)}
</script>
</body></html>
