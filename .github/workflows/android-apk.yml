name: Build Rifugio Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-api-providers
    paths:
      - 'android-shell/**'
      - 'apps/api/**'
      - 'apps/web/index.html'
      - 'apps/web/js/05-vue-app.js'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix apps/api
      - name: Run API contract tests
        run: npm test --prefix apps/api
      - name: Build debug APK
        working-directory: android-shell
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rifugio-android-debug-apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
