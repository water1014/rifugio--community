name: Build Nido Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-api-providers
      - feature/nido-android-rebuild
    paths:
      - 'android-shell/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: nido-android-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Keep the Android debug signing identity stable across CI builds so
      # an installed test APK can be updated without wiping its app data.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nido-android-debug-keystore-v1
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        run: npm ci --prefix apps/api --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Run API contract tests
        run: npm test --prefix apps/api
      - name: Run web tests
        run: npm run test:web
      - name: Install matching Vue template compiler
        run: npm install --no-save --prefix apps/api @vue/compiler-dom@3.5.39 --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Compile complete Vue app template
        run: node apps/web/tools/validate-vue-template.mjs
      - name: Validate Android web JavaScript assets
        run: |
          find apps/web/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('apps/web/index.html', 'utf8');
          const refs = [...html.matchAll(/<script\s+src=["']([^"']+)["']/g)].map(match => match[1]);
          const missing = refs.filter(ref => !fs.existsSync(new URL(ref, 'file://' + process.cwd() + '/apps/web/index.html')));
          if (missing.length) throw new Error('Missing web app scripts: ' + missing.join(', '));
          console.log(`Validated ${refs.length} script references and all JavaScript syntax.`);
          NODE
      - name: Bundle web app into Android assets
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -R apps/web/. android-shell/app/src/main/assets/
      - name: Build debug APK
        working-directory: android-shell
        run: gradle --no-daemon -PnidoVersionCode=${{ github.run_number }} assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nido-android-debug-apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
